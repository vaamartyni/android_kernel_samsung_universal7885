name: Build jackpotlte AOSP permissive

on:
  push:
    branches: [fb0-uaf-fix]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bc bison flex libssl-dev libelf-dev cpio zstd lz4 python3 \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Fetch Neutron Clang 18
        run: |
          mkdir -p "$HOME/neutron"
          curl -sL -o /tmp/neutron.tar.zst https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/05012024/neutron-clang-05012024.tar.zst
          tar -I zstd -xf /tmp/neutron.tar.zst -C "$HOME/neutron"
          "$HOME/neutron/bin/clang" --version

      - name: Build
        run: |
          set -o pipefail
          export PATH="$HOME/neutron/bin:$PATH"
          grep -q '^CONFIG_SECURITY_SELINUX_SETENFORCE_OVERRIDE=y' arch/arm64/configs/exynos7885-jackpotlte_defconfig
          make O=out ARCH=arm64 exynos7885-jackpotlte_defconfig aosp.config
          make O=out -j$(nproc --all) ARCH=arm64 \
            LLVM_DIS="llvm-dis AR=llvm-ar AS=llvm-as NM=llvm-nm LD=ld.lld OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip" \
            LLVM=1 LLVM_IAS=1 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- 2>&1 | tee build.log
          ls -la out/arch/arm64/boot/
          strings out/arch/arm64/boot/Image | grep -m1 "Linux version"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: jackpotlte-aosp-permissive-fb0fix-${{ github.sha }}
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtb.img
            out/.config
          if-no-files-found: warn
